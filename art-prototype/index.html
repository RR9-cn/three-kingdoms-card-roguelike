<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三国 · 孤军行 — 美术样板</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b1b;color:#263d37;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh}button{font:inherit;cursor:pointer}main{width:min(420px,100vw);max-width:100%;min-height:860px;background:#eee6d2;position:relative;overflow:hidden;box-shadow:0 0 80px #0006}.top{height:105px;background:#183e37;color:#e9dfbe;padding:23px 24px 16px;border-bottom:3px solid #ab8b4e;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:10px;letter-spacing:3px;color:#c3aa73}h1{font-family:"Songti SC",serif;font-size:28px;letter-spacing:5px;margin:4px 0}h1 small{font:11px "PingFang SC";letter-spacing:1px;margin-left:7px}.seal{border:1px solid #aa6a4e;color:#edbb93;writing-mode:vertical-rl;padding:7px 4px;font-size:12px;letter-spacing:3px}.route{height:63px;padding:15px 25px;display:flex;align-items:center;justify-content:space-between;font-size:12px;border-bottom:1px solid #b6aa894f}.route strong{font-size:14px}.steps{display:flex;gap:13px;align-items:center;color:#bcb39c}.steps span{width:9px;height:9px;transform:rotate(45deg);border:1px solid #a89e82}.steps span:first-child{background:#b38b43}.steps span:nth-child(2){background:#26584a;outline:3px solid #26584a22}.battle{height:301px;position:relative;background:linear-gradient(#cfd3bd,#e5dec6 62%,#c6baa0 62%,#d8ccb0);overflow:hidden}.mountain{position:absolute;left:-30px;right:-30px;height:155px;bottom:82px;background:#78928b36;clip-path:polygon(0 65%,15% 35%,25% 51%,43% 5%,63% 62%,78% 35%,100% 66%,100% 100%,0 100%)}.mountain.far{bottom:102px;transform:scaleX(-1);opacity:.4}.haze{position:absolute;bottom:78px;width:100%;height:30px;background:linear-gradient(transparent,#e4ddc4)}.battle-title{position:absolute;top:15px;left:24px;font-family:"Songti SC",serif;font-size:12px;letter-spacing:3px;color:#55665b}.flag{position:absolute;top:49px;right:27px;border-left:3px solid #6b6751;height:153px}.flag span{display:block;background:#947b43;color:#e4d3a9;font-family:"Songti SC";padding:12px 6px;clip-path:polygon(0 0,100% 0,100% 85%,50% 100%,0 85%)}.fighter{position:absolute;bottom:39px;width:190px;height:211px}.hero{left:7px}.enemy{right:4px}.sprite{width:192px;height:192px;object-fit:contain;image-rendering:pixelated;position:absolute;bottom:20px;z-index:2;transform:scaleX(-1)}.enemy .sprite{width:174px;height:174px;left:9px}.shadow{position:absolute;width:95px;height:15px;border-radius:50%;background:#5b60492a;bottom:17px;left:48px}.intent{position:absolute;top:7px;right:64px;border:1px solid #9e634849;border-radius:3px;background:#f5ebd5e8;padding:5px 9px;color:#9d4932;font-size:11px;z-index:3}.fighter-label{position:absolute;bottom:-22px;left:42px;right:30px;text-align:center;font-size:12px;font-weight:600;z-index:3}.hp{height:5px;background:#857b6033;margin:5px 0 3px}.hp i{display:block;height:100%;width:100%;background:#426754}.enemy .hp i{background:#aa6c43}.hp-text{font-size:10px;color:#686c58;font-weight:400}.turnbar{display:flex;align-items:center;justify-content:space-between;padding:17px 24px 12px}.turnbar strong{font-size:14px}.turnbar small{font-size:11px;color:#7b806d}.energy{display:flex;align-items:center;gap:7px;font-size:12px}.orb{width:28px;height:28px;background:#2d5b4c;color:#ffefca;display:grid;place-items:center;border:2px solid #a99053;transform:rotate(45deg)}.orb b{transform:rotate(-45deg)}.cards{display:flex;gap:8px;padding:8px 17px 13px;align-items:flex-start}.card{position:relative;width:calc((100% - 16px)/3);height:216px;border:1px solid #a99b77;border-radius:7px;background:#f7efd9;box-shadow:0 4px 0 #d0c5a9;padding:0;color:#253d36;text-align:center;transition:transform .18s,border-color .18s;overflow:visible}.card.active{transform:translateY(-6px);border:2px solid #477863;box-shadow:0 4px 0 #aac1a3}.cost{position:absolute;top:5px;left:6px;background:#285442;color:#fff1cc;border:1px solid #b69b58;width:22px;height:24px;display:grid;place-items:center;border-radius:4px;font-size:13px;z-index:1}.art{height:88px;background:radial-gradient(ellipse,#d3dcc0,transparent 69%);display:grid;place-items:center;border-radius:7px 7px 0 0;border-bottom:1px solid #b9ad8c5c}.card:nth-child(3) .art{background:radial-gradient(ellipse,#ead6a5,transparent 69%)}.art img{width:80px;height:80px;image-rendering:pixelated;object-fit:contain}.card h2{font-family:"Songti SC",serif;font-size:18px;margin:10px 0 5px;letter-spacing:2px}.card p{font-size:11px;line-height:1.7;margin:0 3px;color:#5f6756}.card em{font-style:normal;color:#9c4f37;font-weight:600}.kind{font-size:9px;letter-spacing:2px;color:#8d8b72;position:absolute;bottom:8px;left:0;right:0}.hint{height:27px;text-align:center;font-size:11px;color:#737d68}.bottom{display:flex;align-items:center;justify-content:space-between;padding:7px 24px 17px}.pile{font-size:11px;color:#5d6e5e;display:flex;align-items:center;gap:7px}.pile b{font-size:20px;font-weight:400}.end{padding:11px 31px;color:#eee3bf;background:#244e40;border:1px solid #aa925c;box-shadow:0 3px #17372c;font-size:13px;letter-spacing:2px}.footer{border-top:1px solid #c1b69666;font-size:9px;color:#8e917c;letter-spacing:2px;text-align:center;padding:11px}.toast{position:absolute;left:26px;right:26px;bottom:111px;background:#1d4139f2;color:#f4e8c8;padding:14px;text-align:center;font-size:12px;border:1px solid #af985b;border-radius:4px;display:none;z-index:9}@media(max-width:390px){.cards{padding-left:10px;padding-right:10px;gap:6px}.fighter{transform:scale(.92);transform-origin:bottom center}.hero{left:-9px}.enemy{right:-11px}.card p{font-size:10px}.card h2{font-size:16px}}
</style>
<main>
<header class="top"><div><div class="eyebrow">THREE KINGDOMS · ROGUELIKE</div><h1>三国·孤军行</h1></div><div class="seal">常山赵子龙</div></header>
<div class="route"><div><strong>第一章 · 黄巾初起</strong><br><span style="font-size:10px;color:#7e836c">第 2 / 8 节点 · 荒野遭遇</span></div><div class="steps"><span></span><span></span><span></span><span></span><span></span></div></div>
<section class="battle"><div class="mountain far"></div><div class="mountain"></div><div class="haze"></div><div class="battle-title">长枪所向 · 破阵而行</div><div class="flag"><span>黄巾</span></div><div class="intent">敌方意图 · 攻击 8</div>
<div class="fighter hero"><div class="shadow"></div><img class="sprite" src="assets/zhao-yun.png" alt="PixelLab 生成的赵云像素角色"><div class="fighter-label">赵云<div class="hp"><i></i></div><div class="hp-text">生命 40 / 40</div></div></div>
<div class="fighter enemy"><div class="shadow"></div><img class="sprite" src="assets/yellow-turban.png" alt="PixelLab 生成的黄巾兵像素角色"><div class="fighter-label">黄巾刀兵<div class="hp"><i></i></div><div class="hp-text">生命 24 / 24</div></div></div>
</section>
<div class="turnbar"><div><strong>你的回合</strong> <small>· 第 1 回合</small></div><div class="energy"><span class="orb"><b>3</b></span>行动力 3 / 3</div></div>
<div class="cards">
<button class="card active" data-name="龙胆突刺" aria-pressed="true"><span class="cost">1</span><div class="art"><img src="assets/spear.png" alt="银枪与青色枪芒"></div><h2>龙胆突刺</h2><p>造成 <em>8</em> 点伤害<br>本回合首次攻击 +2</p><span class="kind">攻击 · 枪术</span></button>
<button class="card" data-name="据守反击" aria-pressed="false"><span class="cost">1</span><div class="art"><img src="assets/shield.png" alt="银盾与格挡火花"></div><h2>据守反击</h2><p>获得 <em>6</em> 点护甲<br>受击时反击 4 点</p><span class="kind">技能 · 反击</span></button>
<button class="card" data-name="临阵筹谋" aria-pressed="false"><span class="cost">1</span><div class="art"><img src="assets/strategy.png" alt="红绳竹简兵书"></div><h2>临阵筹谋</h2><p>抽取 <em>2</em> 张牌<br>然后弃置 1 张牌</p><span class="kind">技能 · 筹谋</span></button>
</div>
<div class="hint" id="hint">已选：龙胆突刺 · 点击卡牌预览选择效果</div>
<div class="bottom"><div class="pile">牌库 <b>9</b></div><button class="end">结束回合</button><div class="pile">弃牌 <b>0</b></div></div>
<div class="footer">美术样板 V0.1 · 战斗数值与玩法为展示设定</div><div class="toast" role="status">这是美术预览，完整战斗将在玩法原型中实现。</div>
</main>
<script>document.querySelectorAll('.card').forEach(card=>card.onclick=()=>{document.querySelectorAll('.card').forEach(c=>{c.classList.remove('active');c.setAttribute('aria-pressed','false')});card.classList.add('active');card.setAttribute('aria-pressed','true');document.querySelector('#hint').textContent='已选：'+card.dataset.name+' · 点击卡牌预览选择效果'});let timer;document.querySelector('.end').onclick=()=>{const t=document.querySelector('.toast');t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',2400)};</script>
</html>
