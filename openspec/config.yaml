schema: spec-driven

context: |
  Steam PC 单人横屏午夜落槌卡牌肉鸽。
  当前v0.9为12种能力卡、六选三顺序连锁、三场收集升级验证版。
  阅读docs/GAME_DESIGN.md与docs/CONTENT.md。
  TypeScript纯规则内核，Electron桌面壳；AI只读公开信息。
  不保留旧版贵宾或牌型运行实现。

rules:
  design:
    - 规则与数值改动须同步游戏设计书、能力规格及种子配置。
    - 明确随机状态、隐藏信息边界和效果执行顺序。
  tasks:
    - 尚未实现的任务不得勾选完成。
    - 先规则内核和单战，再桌面平台冒烟，再征程和美术。

